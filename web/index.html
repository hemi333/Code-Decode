<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Decode — 내가 쓰지 않은 코드 읽기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-text">
    <h1>Code&nbsp;Decode</h1>
    <p>AI가 써준 코드를 붙여넣으면, 무엇을 모르고 있는지 짚어드립니다.</p>
  </div>
  <dl class="masthead-meta">
    <dt>모델</dt><dd id="meta-model">확인 중</dd>
    <dt>문서 조회 범위</dt><dd id="meta-scope">확인 중</dd>
  </dl>
</header>

<div class="trace" id="trace" hidden>
  <ol class="trace-steps" id="trace-steps"></ol>
  <p class="trace-usage" id="trace-usage"></p>
</div>

<main class="edition">

  <section class="source" aria-label="원문">
    <div class="pane-head">
      <h2>원문</h2>
      <div class="pane-actions">
        <button type="button" id="btn-edit" class="link-button" hidden>코드 바꾸기</button>
        <button type="button" id="btn-sample" class="link-button">예제 넣기</button>
      </div>
    </div>

    <div class="source-body">
      <textarea id="code" spellcheck="false" aria-label="파이썬 코드"
        placeholder="여기에 파이썬 코드를 붙여넣으세요."></textarea>
      <div id="rendered" class="rendered" hidden></div>
    </div>

    <div class="run-row">
      <button type="button" id="btn-decode" class="primary">코드 해독하기</button>
      <button type="button" id="btn-ast" class="secondary">AST만 보기</button>
      <span class="hint" id="hint"></span>
    </div>
  </section>

  <section class="apparatus" aria-label="주해" aria-live="polite">
    <div class="pane-head">
      <h2>주해</h2>
      <p class="legend" id="legend" hidden>
        <span class="key key-documented">문서 확인</span>
        <span class="key key-inferred">추론</span>
        <span class="key key-unresolved">해석 실패</span>
      </p>
    </div>

    <div id="entries" class="entries"></div>

    <div id="empty" class="empty">
      <p>왼쪽에 코드를 넣고 해독하면, 항목이 여기에 하나씩 쌓입니다.</p>
      <p>각 항목은 <em>무엇을</em> 하는지, <em>왜</em> 그렇게 썼는지, 근거가 된 <em>공식 문서</em>가 어디인지를 담습니다. 마지막 줄의 질문에 답할 수 있으면 그 항목은 이해한 것입니다.</p>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
